[project]
name = "forest-keeper-backend"
version = "0.1.0"
description = "Forest Keeper modular API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "argon2-cffi>=25.1,<26",
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.9,<3",
    "redis>=6,<8",
    "rq>=2.3,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.22,<1",
    "defusedxml>=0.7.1,<1",
    "openpyxl>=3.1.5,<4",
]

[dependency-groups]
dev = [
    "bandit>=1.8,<2",
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pip-audit>=2.9,<3",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
    "types-defusedxml>=0.7.0.20260504",
    "types-openpyxl>=3.1.5.20261017",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the configured PostgreSQL and Redis services"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = ["rq.*"]
ignore_missing_imports = true
