name: forest-keeper

x-backend: &backend
  build: ./backend
  environment:
    FK_DATABASE_URL: postgresql+psycopg://forest_keeper:${FK_POSTGRES_PASSWORD:?Run scripts/dev-init.sh}@postgres:5432/forest_keeper
    FK_REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: forest_keeper
      POSTGRES_USER: forest_keeper
      POSTGRES_PASSWORD: ${FK_POSTGRES_PASSWORD:?Run scripts/dev-init.sh}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forest_keeper -d forest_keeper"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 15

  worker:
    <<: *backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./deploy/local/tls:/etc/nginx/tls:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
